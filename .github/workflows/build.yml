name: Build FFGrabber installers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (mock FFmpeg and argument planning)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Run automated tests
        shell: pwsh
        run: |
          dotnet test tests/FFGrabber.Tests/FFGrabber.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }

  build:
    needs: test
    name: Build and verify ${{ matrix.arch }} installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            machine: 0x8664
          - arch: arm64
            rid: win-arm64
            machine: 0xAA64
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Determine version
        id: app-version
        shell: pwsh
        run: |
          $version = '0.5.8'
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}'.StartsWith('v')) {
            $version = '${{ github.ref_name }}'.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          $fileVersion = (($version -split '[-+]')[0]) + '.0'
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file_value=$fileVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore and publish
        shell: pwsh
        run: |
          dotnet restore src/FFGrabber/FFGrabber.csproj -r ${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet publish src/FFGrabber/FFGrabber.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.app-version.outputs.value }} -o artifacts/publish/${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path 'artifacts/publish/${{ matrix.arch }}/FFGrabber.exe')) { throw 'Published executable missing.' }
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md -Destination 'artifacts/publish/${{ matrix.arch }}' -Force

      - name: Verify executable architecture and that no FFmpeg is bundled
        shell: pwsh
        run: |
          function Get-PeMachine([string] $Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3C
              $offset = $reader.ReadInt32()
              if ($offset -lt 64 -or $offset -gt ($stream.Length - 6)) { throw "Invalid PE header: $Path" }
              $stream.Position = $offset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE signature: $Path" }
              return [int]$reader.ReadUInt16()
            } finally { $stream.Dispose() }
          }
          $publish = 'artifacts/publish/${{ matrix.arch }}'
          $app = Join-Path $publish 'FFGrabber.exe'
          if (-not (Test-Path $app -PathType Leaf)) { throw "Required executable missing: $app" }
          $machine = Get-PeMachine $app
          $expected = [int]${{ matrix.machine }}
          if ($machine -ne $expected) { throw "Wrong architecture for $app. Expected $expected, got $machine." }

          # FFGrabber is import-only: no FFmpeg executable or tool folder may be present in the payload.
          $forbidden = @(Get-ChildItem -Path $publish -Recurse -File |
            Where-Object { $_.Name -in @('ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe') })
          if ($forbidden.Count -gt 0) { throw "Bundled FFmpeg executables are not allowed: $($forbidden.FullName -join ', ')" }
          if (Test-Path (Join-Path $publish 'tools/ffmpeg')) { throw 'A bundled tools/ffmpeg folder is not allowed.' }

      - name: Install latest stable Inno Setup from official signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            'User-Agent' = 'FFGrabber-build'
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            Authorization = "Bearer $env:GH_TOKEN"
          }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/jrsoftware/issrc/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^innosetup-\d+\.\d+\.\d+-x64\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "Official Inno Setup x64 installer was not found in release $($release.tag_name)." }
          if ($asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw 'GitHub did not provide the official installer SHA-256 digest; refusing an unverified download.' }

          $installerPath = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installerPath -Headers @{ 'User-Agent' = 'FFGrabber-build' }
          $actualHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = ($asset.digest -replace '^sha256:', '').ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Inno Setup SHA-256 mismatch. Expected $expectedHash, got $actualHash." }

          $signature = Get-AuthenticodeSignature -FilePath $installerPath
          if ($signature.Status -ne 'Valid') { throw "The official Inno Setup Authenticode signature is not valid: $($signature.Status)." }

          $installDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          $process = Start-Process -FilePath $installerPath -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited with code $($process.ExitCode)." }
          $iscc = Join-Path $installDirectory 'ISCC.exe'
          if (-not (Test-Path $iscc -PathType Leaf)) { throw "Installed compiler not found: $iscc" }
          Write-Host "Installed signed Inno Setup $($release.tag_name); verified SHA-256 $actualHash."

      - name: Compile installer and create SHA-256
        shell: pwsh
        run: |
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe'
          if (-not (Test-Path $iscc -PathType Leaf)) { throw "Verified Inno Setup compiler was not found: $iscc" }
          New-Item -ItemType Directory -Path artifacts/installer -Force | Out-Null
          & $iscc '/DAppArch=${{ matrix.arch }}' '/DAppVersion=${{ steps.app-version.outputs.value }}' '/DAppFileVersion=${{ steps.app-version.outputs.file_value }}' installer/FFGrabber.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setup = Join-Path (Get-Location) 'artifacts/installer/FFGrabber-Setup-${{ matrix.arch }}-v${{ steps.app-version.outputs.value }}.exe'
          if (-not (Test-Path $setup)) { throw "Setup file missing: $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$setup.sha256", "$hash  $([IO.Path]::GetFileName($setup))`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FFGrabber-Setup-${{ matrix.arch }}
          path: artifacts/installer/FFGrabber-Setup-${{ matrix.arch }}-v${{ steps.app-version.outputs.value }}.exe*
          if-no-files-found: error
          retention-days: 14

  linux-test:
    name: Linux unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Run automated tests
        run: dotnet test tests/FFGrabber.Tests/FFGrabber.Tests.csproj -c Release

  linux-build:
    needs: linux-test
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rid: linux-x64
            deb_arch: amd64
            rpm_arch: x86_64
            appimage_arch: x86_64
            appimage_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
            appimage_arch: aarch64
            appimage_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Determine version
        id: app-version
        shell: bash
        run: |
          version='0.5.8'
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" == v* ]]; then
            version=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Publish self-contained Linux app
        env:
          RID: ${{ matrix.rid }}
          APP_VERSION: ${{ steps.app-version.outputs.value }}
        run: |
          set -euo pipefail
          dotnet publish src/FFGrabber/FFGrabber.csproj -c Release -r "$RID" --self-contained true "-p:Version=$APP_VERSION" -o "artifacts/publish/$RID"
          cp LICENSE THIRD-PARTY-NOTICES.md "artifacts/publish/$RID/"
          test -x "artifacts/publish/$RID/FFGrabber"
          if find "artifacts/publish/$RID" -type f \( -name ffmpeg -o -name ffprobe -o -name ffplay -o -name ffmpeg.exe -o -name ffprobe.exe -o -name ffplay.exe \) -print -quit | grep -q .; then
            echo "FFGrabber must never bundle FFmpeg tools." >&2
            exit 1
          fi

      - name: Install Linux package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm curl
          sudo gem install --no-document fpm -v 1.17.0

      - name: Build .deb, .rpm, AppImage, and portable .tar.gz
        env:
          VERSION: ${{ steps.app-version.outputs.value }}
          RID: ${{ matrix.rid }}
          SHORT_ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          APPIMAGE_SHA256: ${{ matrix.appimage_sha256 }}
        run: bash scripts/build-linux-packages.sh

      - name: Verify Linux packages and create per-file SHA-256
        env:
          APP_VERSION: ${{ steps.app-version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for extension in deb rpm AppImage tar.gz; do
            file="artifacts/linux/FFGrabber-$APP_VERSION-linux-$ARCH.$extension"
            test -s "$file" || { echo "Missing package: $file" >&2; exit 1; }
            (cd artifacts/linux && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
          if find "artifacts/publish/$RID" -type f \( -name ffmpeg -o -name ffprobe -o -name ffplay -o -name ffmpeg.exe -o -name ffprobe.exe -o -name ffplay.exe \) -print -quit | grep -q .; then
            echo "FFmpeg was unexpectedly bundled." >&2
            exit 1
          fi

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FFGrabber-Linux-${{ matrix.arch }}
          path: artifacts/linux/FFGrabber-*-linux-${{ matrix.arch }.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish permanent GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.5.8]'))
    needs: [build, linux-build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Determine release version
        id: release-version
        shell: pwsh
        run: |
          $version = '0.5.8'
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}'.StartsWith('v')) {
            $version = '${{ github.ref_name }}'.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check whether this release already exists
        id: release-check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = 'v${{ steps.release-version.outputs.value }}'
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tagName"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'FFGrabber-release'
          }
          try {
            $existing = Invoke-RestMethod -Uri $uri -Headers $headers
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $tagName already exists at $($existing.html_url). Its assets will not be overwritten."
          } catch {
            $statusCode = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 404) { throw }
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $tagName does not exist; will publish verified installers."
          }

      - name: Download x64 installer
        if: steps.release-check.outputs.exists != 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: FFGrabber-Setup-x64
          path: release-assets

      - name: Download ARM64 installer
        if: steps.release-check.outputs.exists != 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: FFGrabber-Setup-arm64
          path: release-assets

      - name: Download Linux x64 packages
        if: steps.release-check.outputs.exists != 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: FFGrabber-Linux-x64
          path: release-assets

      - name: Download Linux ARM64 packages
        if: steps.release-check.outputs.exists != 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: FFGrabber-Linux-arm64
          path: release-assets

      - name: Create combined SHA-256 manifest
        if: steps.release-check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -Path release-assets -File -Filter 'FFGrabber-Setup-*.exe')
          if ($setups.Count -ne 2) { throw "Expected both Windows setup executables, found $($setups.Count)." }
          $allNames = @(Get-ChildItem -Path release-assets -File | ForEach-Object { $_.Name })
          $version = '${{ steps.release-version.outputs.value }}'
          $expected = @(
            "FFGrabber-Setup-x64-v$version.exe",
            "FFGrabber-Setup-arm64-v$version.exe",
            "FFGrabber-$version-linux-x64.deb",
            "FFGrabber-$version-linux-x64.rpm",
            "FFGrabber-$version-linux-x64.AppImage",
            "FFGrabber-$version-linux-x64.tar.gz",
            "FFGrabber-$version-linux-arm64.deb",
            "FFGrabber-$version-linux-arm64.rpm",
            "FFGrabber-$version-linux-arm64.AppImage",
            "FFGrabber-$version-linux-arm64.tar.gz"
          )
          foreach ($name in $expected) {
            if ($allNames -notcontains $name) { throw "Expected release package is missing: $name" }
          }
          $packages = @(Get-ChildItem -Path release-assets -File |
            Where-Object { $_.Extension -ne '.sha256' -and $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name)
          $lines = foreach ($package in $packages) {
            $hash = (Get-FileHash -Path $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Get-Location) 'release-assets/SHA256SUMS.txt'),
            [string[]]$lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish checksummed setup files
        if: steps.release-check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.release-version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: FFGrabber v${{ steps.release-version.outputs.value }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
