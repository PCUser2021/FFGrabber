name: Build FFGrabber for Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }} packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            rid: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm file desktop-file-utils imagemagick
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="0.5.8"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Publish self-contained Linux application
        run: |
          set -euo pipefail
          dotnet restore src/FFGrabber/FFGrabber.csproj -r "${{ matrix.rid }}"
          dotnet publish src/FFGrabber/FFGrabber.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=false -p:Version="${{ steps.version.outputs.value }}" -p:UseAppHost=true -o "artifacts/publish/${{ matrix.arch }}"
          test -x "artifacts/publish/${{ matrix.arch }}/FFGrabber"
          if find "artifacts/publish/${{ matrix.arch }}" -type f \( -name ffmpeg -o -name ffprobe -o -name ffplay \) | grep -q .; then echo "FFmpeg binaries must not be bundled"; exit 1; fi
          install -m 0644 LICENSE THIRD-PARTY-NOTICES.md "artifacts/publish/${{ matrix.arch }}/"
      - name: Create portable archive
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          tar -C "artifacts/publish/${{ matrix.arch }}" -czf "artifacts/packages/FFGrabber-linux-${{ matrix.arch }}-v${{ steps.version.outputs.value }}.tar.gz" .
      - name: Build Debian package
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deb-root"
          install -d "$root/opt/ffgrabber" "$root/usr/bin" "$root/DEBIAN"
          cp -a "artifacts/publish/${{ matrix.arch }}/." "$root/opt/ffgrabber/"
          printf '#!/bin/sh\nexec /opt/ffgrabber/FFGrabber "$@"\n' > "$root/usr/bin/ffgrabber"
          chmod 0755 "$root/usr/bin/ffgrabber"
          cat > "$root/DEBIAN/control" <<EOF
          Package: ffgrabber
          Version: ${{ steps.version.outputs.value }}
          Section: video
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: FFGrabber contributors
          Description: Graphical frontend for user-provided FFmpeg
          EOF
          dpkg-deb --root-owner-group --build "$root" "artifacts/packages/ffgrabber_${{ steps.version.outputs.value }}_${{ matrix.deb_arch }}.deb"
          dpkg-deb --info "artifacts/packages/ffgrabber_${{ steps.version.outputs.value }}_${{ matrix.deb_arch }}.deb"
      - name: Build RPM package
        run: |
          set -euo pipefail
          top="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cat > "$top/SPECS/ffgrabber.spec" <<EOF
          Name: ffgrabber
          Version: ${{ steps.version.outputs.value }}
          Release: 1
          Summary: Graphical frontend for user-provided FFmpeg
          License: MIT
          BuildArch: ${{ matrix.rpm_arch }}
          %description
          FFGrabber does not bundle FFmpeg.
          %install
          mkdir -p %{buildroot}/opt/ffgrabber %{buildroot}/usr/bin
          cp -a "$GITHUB_WORKSPACE/artifacts/publish/${{ matrix.arch }}/." %{buildroot}/opt/ffgrabber/
          printf '#!/bin/sh\nexec /opt/ffgrabber/FFGrabber "$@"\n' > %{buildroot}/usr/bin/ffgrabber
          chmod 0755 %{buildroot}/usr/bin/ffgrabber
          %files
          /opt/ffgrabber
          /usr/bin/ffgrabber
          EOF
          rpmbuild --define "_topdir $top" --target "${{ matrix.rpm_arch }}" -bb "$top/SPECS/ffgrabber.spec"
          cp "$top/RPMS/${{ matrix.rpm_arch }}/"*.rpm artifacts/packages/
      - name: Build AppImage (x64 only)
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          appdir="$RUNNER_TEMP/FFGrabber.AppDir"
          install -d "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -a artifacts/publish/x64/. "$appdir/usr/bin/"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/FFGrabber" "$@"
          EOF
          chmod 0755 "$appdir/AppRun"
          cat > "$appdir/ffgrabber.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=FFGrabber
          Comment=Frontend for user-provided FFmpeg
          Exec=FFGrabber
          Icon=ffgrabber
          Categories=AudioVideo;Video;
          Terminal=false
          EOF
          cp "$appdir/ffgrabber.desktop" "$appdir/usr/share/applications/ffgrabber.desktop"
          convert -size 256x256 xc:'#123b66' -fill '#49d9ff' -draw 'roundrectangle 36,36 220,220 28,28' -fill '#123b66' -draw 'polygon 96,72 96,184 184,128' "$appdir/ffgrabber.png"
          cp "$appdir/ffgrabber.png" "$appdir/usr/share/icons/hicolor/256x256/apps/ffgrabber.png"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimagetool.AppImage" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool.AppImage" "$appdir" "artifacts/packages/FFGrabber-linux-x64-v${{ steps.version.outputs.value }}.AppImage"
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts/packages
          sha256sum * > SHA256SUMS-linux-${{ matrix.arch }}.txt
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FFGrabber-Linux-${{ matrix.arch }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Attach packages to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for attempt in $(seq 1 30); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" artifacts/packages/* --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 20
          done
          echo "Release $tag was not created in time." >&2
          exit 1
